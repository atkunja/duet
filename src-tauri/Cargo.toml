[package]
name = "duet"
version = "0.1.0"
description = "Local orchestration for Claude Code and Codex CLI"
authors = ["Duet Contributors"]
edition = "2021"

[lib]
name = "duet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time", "sync", "io-util", "fs"] }
tokio-util = "0.7"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
which = "7"
dirs = "6"
parking_lot = "0.12"
shell-words = "1"
regex = "1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
